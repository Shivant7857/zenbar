<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Top Bar Mockup with Floating Zen Look -->
  <g transform="translate(150, 48)" filter="url(#shadow)">
    <rect width="900" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Workspace indicator -->
    <rect x="24" y="15" width="28" height="16" rx="8" fill="#38bdf8" />
    <circle cx="64" cy="23" r="5" fill="#64748b" />
    <circle cx="80" cy="23" r="5" fill="#64748b" />
    <!-- Clock in center -->
    <text x="450" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Oct 29 &nbsp; 12:30 PM</text>
    <!-- System icons right -->
    <circle cx="800" cy="23" r="4" fill="#38bdf8" />
    <circle cx="820" cy="23" r="4" fill="#818cf8" />
    <circle cx="840" cy="23" r="4" fill="#10b981" />
    <rect x="856" y="16" width="22" height="14" rx="4" fill="#475569" />
  </g>

  <!-- Downward Arrow Indicating Smart Auto-Hide Slide -->
  <path d="M 600,108 L 600,132 M 590,122 L 600,132 L 610,122" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Title & Tagline -->
  <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#brandGrad)" letter-spacing="2">ZenBar</text>
  <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Intelligent Top Status Bar Auto-Hide &amp; Distraction-Free Zen Mode</text>

  <!-- Feature Pills -->
  <g transform="translate(260, 310)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="19" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="90" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">✨ Auto-Hide (Peek)</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="180" height="38" rx="19" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="290" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">👻 Ghost / Zen Mode</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="180" height="38" rx="19" fill="url(#pillGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <text x="490" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⌨️ Super+Alt+H</text>

    <!-- Pill 4 -->
    <rect x="600" y="0" width="180" height="38" rx="19" fill="url(#pillGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="690" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🎨 Libadwaita UI</text>
  </g>

  <!-- Small Footer -->
  <text x="600" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Designed with passion by Shivant (@Shivant7857) • GNOME Shell 45 - 51+</text>
</svg>
